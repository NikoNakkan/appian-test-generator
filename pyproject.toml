[project]
name = "appian-test-generator"
version = "0.1.0"
description = "Reads Appian exports, maps the app, generates tests layer by layer."
requires-python = ">=3.12"
# Two runtime libraries, pinned: lark (SAIL parser), openpyxl (Excel approval sheet; it brings
# et_xmlfile). Everything else is the Python standard library.
dependencies = ["lark==1.2.2", "openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "mypy==2.4.1"]

[project.scripts]
atg = "atg.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The demo export is data: SAIL and XML read best one object per line.
"tests/demo/spec.py" = ["E501"]
"tests/demo/content.py" = ["E501"]
"tests/demo/xml.py" = ["E501"]
"tests/demo/process.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.setuptools.package-data]
atg = ["web/static/*"]
